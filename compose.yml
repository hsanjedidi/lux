services:
  proxy:
    container_name: luxuria-reverse-proxy

    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_NODE_ENV: production

    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile
      - luxuria-caddy-data:/data
      - luxuria-caddy-config:/config

    ports:
      - 3030:4000
    networks:
      - default

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        NODE_ENV: production

    environment:
      NODE_ENV: production
      carrersKey: ${carrersKey}
      contactUsKey: ${contactUsKey}
      RECIPIENT: ${RECIPIENT}

    restart: unless-stopped

volumes:
  luxuria-caddy-data:
  luxuria-caddy-config:

networks:
  default:
    name: luxuria-network
